[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tictactoe"
version = "1.0.0"
description = "Noughts and crosses in the terminal, with an opponent that never loses."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tictactoe = "tictactoe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
